# Builds and publishes the Sauce Counter whenever main changes.
#
# Push to main, and a couple of minutes later both iPads have it. Three
# secrets make this work — see README, "Publishing a change".

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Lets the deploy be re-run from the Actions tab without pushing anything.
  workflow_dispatch:

# Two pushes in quick succession would otherwise race, and whichever finished
# last would win regardless of which was newer.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the real Apps Script against a pretend Sheet, and checks the item
      # list in the app matches the one in the script.
      - name: Test the Sheet script
        run: npm test

      # Without the Sheet address the build still succeeds - it just quietly
      # produces demo mode, which would look right on the iPads while sending
      # nothing to the Sheet. Fail loudly instead.
      - name: Refuse to build without the Sheet address
        env:
          VITE_SHEET_URL: ${{ secrets.VITE_SHEET_URL }}
        run: |
          if [ -z "$VITE_SHEET_URL" ]; then
            echo "::error::VITE_SHEET_URL is not set."
            echo "::error::Building without it would ship demo mode to the store."
            exit 1
          fi

      - name: Build
        env:
          VITE_SHEET_URL: ${{ secrets.VITE_SHEET_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creates the Pages project the first time; harmless after that.
          npx wrangler pages project create cfa-condiment-counter --production-branch=main || true
          npx wrangler pages deploy dist \
            --project-name=cfa-condiment-counter \
            --branch=main
